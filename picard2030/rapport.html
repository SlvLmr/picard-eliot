<body>
    <div class="toolbar no-print">
        <a class="tb-btn ghost" href="index.html"><i class="ri-arrow-left-line"></i> Retour</a>

        <label class="tb-check opt-bureaux"><input type="checkbox" id="opt-actions" checked> Détail des actions</label>

        <button class="tb-btn" id="btn-print"><i class="ri-file-pdf-2-line"></i> Enregistrer en PDF</button>
    </div>
    <p class="print-hint no-print">Dans la fenêtre d'impression, choisissez <b>« Enregistrer au format PDF »</b> comme destination.</p>
