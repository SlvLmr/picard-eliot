<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picard 2030 — Votre idée</title>
    <link rel="icon" type="image/svg+xml" href="logo/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css">
    <style>
        :root { --gold: #f1c587; --gold-2: #e7b876; --ink: #1a1206; --line: #1c1c21; --line-2: #2a2a30; --muted: #8a8a94; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0; color: #fff; font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
            background: radial-gradient(900px 520px at 50% -10%, rgba(241, 197, 135, .16), transparent 60%), #000;
            display: flex; flex-direction: column; align-items: center; padding: 28px 16px 40px;
        }
        .top { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; color: inherit; text-decoration: none; }
        .top img { height: 44px; }
        .top b { font-weight: 600; letter-spacing: -.01em; }
        .card { width: min(560px, 100%); background: #0b0b0d; border: 1px solid var(--line); border-radius: 20px; padding: 30px 28px 26px; position: relative; overflow: hidden; }
        .card::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        .bulb { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 32px; color: var(--ink);
            background: linear-gradient(135deg, var(--gold), #c98a3e); box-shadow: 0 0 0 0 rgba(241, 197, 135, .5); animation: pulse 2.4s infinite; margin-bottom: 16px; }
        @keyframes pulse { 70% { box-shadow: 0 0 0 16px rgba(241, 197, 135, 0); } 100% { box-shadow: 0 0 0 0 rgba(241, 197, 135, 0); } }
        h1 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -.03em; font-weight: 700; }
        .lead { margin: 8px 0 22px; color: #b9b9c0; }
        .types { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
        .types input { position: absolute; opacity: 0; pointer-events: none; }
        .types span { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 99px; border: 1px solid var(--line-2); background: #111114; cursor: pointer; transition: .2s; font-weight: 500; }
        .types span:hover { border-color: #55555e; }
        .types input:checked + span { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }
        .types input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
        label.f { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-size: 13px; font-weight: 600; color: #b9b9c0; }
        label.f small { font-weight: 400; color: var(--muted); }
        select, textarea, input[type="text"] { width: 100%; font: inherit; color: #fff; background: #111114; border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; }
        textarea { min-height: 140px; resize: vertical; }
        select:focus, textarea:focus, input:focus { outline: 2px solid rgba(241, 197, 135, .35); border-color: var(--gold); }
        .count { align-self: flex-end; font-weight: 400; font-size: 11.5px; color: var(--muted); margin-top: -2px; }
        .send { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border: 0; border-radius: 14px; cursor: pointer;
            background: var(--gold); color: var(--ink); font: inherit; font-weight: 700; font-size: 16px; transition: .2s; margin-top: 6px; }
        .send:hover { background: var(--gold-2); transform: translateY(-1px); }
        .send:disabled { opacity: .6; cursor: default; transform: none; }
        .note { display: flex; align-items: center; gap: 6px; justify-content: center; margin-top: 14px; color: var(--muted); font-size: 12.5px; }
        .err { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: rgba(248, 113, 113, .12); color: #fca5a5; font-size: 13px; }
        .merci { text-align: center; padding: 18px 0 6px; }
        .merci .ok { width: 76px; height: 76px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; font-size: 40px; color: #0b0b0d; background: #34d399; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
        @keyframes pop { from { transform: scale(0); } }
        .merci p { color: #b9b9c0; margin: 8px 0 22px; }
        .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .ghost { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line-2); color: #fff; text-decoration: none; background: #111114; font: inherit; cursor: pointer; }
        .ghost:hover { border-color: #55555e; }
        [hidden] { display: none !important; }
        .spin { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <a class="top" href="index.html"><img src="logo/picard2030-embleme.svg" alt=""><b>Picard 2030</b></a>

    <main class="card">
        <form id="form" autocomplete="off">
            <div class="bulb" aria-hidden="true"><i class="ri-lightbulb-flash-fill"></i></div>
            <h1>Votre idée compte.</h1>
            <p class="lead">Une idée, une remarque ou une question sur Picard 2030&nbsp;? Écrivez-nous, l'équipe lit chaque message.</p>

            <div class="types" role="radiogroup" aria-label="Type de message">
                <label><input type="radio" name="type" value="Idée" checked><span>💡 Une idée</span></label>
                <label><input type="radio" name="type" value="Remarque"><span>💬 Une remarque</span></label>
                <label><input type="radio" name="type" value="Question"><span>❓ Une question</span></label>
            </div>

            <label class="f">De quoi parle votre message&nbsp;?
                <select name="sujet">
                    <option>Picard 2030 en général</option>
                    <option>Nos équipes</option>
                    <option>Nos installateurs agréés</option>
                    <option>Nos produits</option>
                    <option>Faire connaître Picard</option>
                    <option>Nos clients</option>
                    <option>Eliot</option>
                    <option>Production</option>
                    <option>Autre</option>
                </select>
            </label>
            <label class="f">Votre message
                <textarea name="message" maxlength="1500" required placeholder="Racontez-nous…"></textarea>
                <span class="count" id="count">0 / 1500</span>
            </label>
            <label class="f"><span>Votre nom <small>(facultatif)</small></span>
                <input type="text" name="nom" placeholder="Prénom Nom">
            </label>

            <button class="send" type="submit"><i class="ri-send-plane-fill"></i> Envoyer mon message</button>
            <p class="err" id="err" hidden></p>
            <p class="note"><i class="ri-lock-line"></i> Votre message est transmis uniquement à l'équipe Picard 2030.</p>
        </form>

        <div class="merci" id="merci" hidden>
            <div class="ok"><i class="ri-check-line"></i></div>
            <h1>Merci&nbsp;!</h1>
            <p>Votre message est bien arrivé à l'équipe Picard 2030.</p>
            <div class="links">
                <button class="ghost" id="encore" type="button"><i class="ri-add-line"></i> Envoyer une autre idée</button>
                <a class="ghost" href="index.html"><i class="ri-road-map-line"></i> Voir le suivi Picard 2030</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="cloud.js?v=20261026c"></script>
    <script>
        const form = document.getElementById('form'), err = document.getElementById('err');
        const sujet = new URLSearchParams(location.search).get('sujet');
        if (sujet) [...form.sujet.options].forEach(o => { if (o.text === sujet) o.selected = true; });
        form.message.oninput = () => { document.getElementById('count').textContent = `${form.message.value.length} / 1500`; };
        initCloud();
        form.onsubmit = async e => {
            e.preventDefault();
            const f = new FormData(form);
            const msg = { type: f.get('type'), sujet: f.get('sujet'), message: String(f.get('message')).trim(), nom: String(f.get('nom')).trim() };
            if (!msg.message) return;
            const btn = form.querySelector('.send');
            btn.disabled = true; btn.innerHTML = '<i class="ri-loader-4-line spin"></i> Envoi…'; err.hidden = true;
            try {
                await submitMessage(msg);
                form.hidden = true; document.getElementById('merci').hidden = false;
                form.reset(); form.message.oninput();
            } catch (x) {
                err.textContent = "L'envoi n'a pas abouti. Vérifiez votre connexion et réessayez."; err.hidden = false;
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="ri-send-plane-fill"></i> Envoyer mon message';
            }
        };
        document.getElementById('encore').onclick = () => { document.getElementById('merci').hidden = true; form.hidden = false; form.message.focus(); };
    </script>
</body>
</html>
